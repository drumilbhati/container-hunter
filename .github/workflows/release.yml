name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Binary
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          BINARY_NAME="container-hunter"
          DIST_DIR="dist"
          mkdir -p "${DIST_DIR}"

          ARCHIVE_NAME="container-hunter_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          TARGET_DIR="${DIST_DIR}/${ARCHIVE_NAME}"
          mkdir -p "${TARGET_DIR}"

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${TARGET_DIR}/${BINARY_NAME}" ./cmd/container-hunter

          cp README.md "${TARGET_DIR}/"
          if [ -f LICENSE ]; then cp LICENSE "${TARGET_DIR}/"; fi

          tar -czf "${DIST_DIR}/${ARCHIVE_NAME}.tar.gz" -C "${DIST_DIR}" "${ARCHIVE_NAME}"

          # Compute SHA-256 checksum
          cd "${DIST_DIR}"
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Consolidate Checksums
        run: |
          cd release-assets
          cat *.sha256 > checksums.txt
          rm -f *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
